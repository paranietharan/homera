<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>New Tab</title>
  <link rel="stylesheet" href="newtab.css" />
</head>
<body>
  <div id="wallpaper-layer" class="wallpaper-layer"></div>
  <div id="wallpaper-overlay" class="wallpaper-overlay"></div>

  <main class="center-content">
    <div class="clock-container">
      <h1 id="clock" class="clock">00:00</h1>
      <p id="date" class="date">Loading date...</p>
      <p id="greeting" class="greeting">Welcome back</p>
    </div>

    <form id="search-form" class="search-bar" action="https://www.google.com/search" method="GET">
      <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="8"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
      <input
        type="text"
        name="q"
        id="search-input"
        placeholder="Search Google or type a query..."
        autocomplete="off"
      />
    </form>
  </main>

  <button id="open-settings-btn" class="floating-settings-btn" title="Change Wallpaper">
    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
      <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
      <circle cx="8.5" cy="8.5" r="1.5"></circle>
      <polyline points="21 15 16 10 5 21"></polyline>
    </svg>
    <span>Customize Wallpaper</span>
  </button>

  <aside id="settings-drawer" class="settings-drawer hidden" aria-hidden="true">
    <div class="drawer-header">
      <div class="brand">
        <img src="icon.png" alt="Homera Logo" class="brand-logo" />
        <div>
          <h2>Homera</h2>
          <p>Wallpaper Studio</p>
        </div>
      </div>
      <button id="close-settings-btn" class="icon-btn" title="Close">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </div>

    <div class="drawer-body">
      <section class="control-section">
        <label class="section-title">Select Image From Computer</label>
        <label for="file-upload" class="upload-zone" id="drop-zone">
          <input type="file" id="file-upload" accept="image/*" hidden />
          <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="1.8">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="17 8 12 3 7 8"></polyline>
            <line x1="12" y1="3" x2="12" y2="15"></line>
          </svg>
          <span class="upload-title">Choose an image or drag & drop</span>
          <span class="upload-hint">Supports JPG, PNG, WebP, GIF</span>
        </label>
      </section>

      <section class="control-section">
        <label class="section-title">Image URL</label>
        <div class="url-input-group">
          <input type="url" id="url-input" placeholder="https://example.com/wallpaper.jpg" />
          <button id="apply-url-btn" class="primary-btn">Apply</button>
        </div>
      </section>

      <section class="control-section">
        <label class="section-title">Curated Presets</label>
        <div id="preset-grid" class="preset-grid"></div>
      </section>

      <section class="control-section">
        <label class="section-title">Appearance Adjustments</label>
        <div class="slider-row">
          <div class="slider-label">
            <span>Background Dim</span>
            <span id="dim-val">25%</span>
          </div>
          <input type="range" id="dim-slider" min="0" max="80" value="25" />
        </div>

        <div class="slider-row">
          <div class="slider-label">
            <span>Backdrop Blur</span>
            <span id="blur-val">0px</span>
          </div>
          <input type="range" id="blur-slider" min="0" max="24" value="0" />
        </div>

        <div class="slider-row">
          <div class="slider-label">
            <span>Image Fit</span>
          </div>
          <div class="segmented-control">
            <button type="button" data-fit="cover" class="fit-btn active">Fill (Cover)</button>
            <button type="button" data-fit="contain" class="fit-btn">Fit (Contain)</button>
          </div>
        </div>
      </section>
    </div>

    <div class="drawer-footer">
      <button id="reset-btn" class="secondary-btn">Reset to Default</button>
      <span id="status-msg" class="status-msg"></span>
    </div>
  </aside>

  <script src="wallpaper.js"></script>
  <script src="newtab.js"></script>
</body>
</html>
